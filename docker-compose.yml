# Local Valkey for BullMQ / cache / Socket.IO adapter. Matches the ElastiCache
# setup in AWS: single node, no cluster mode, no AUTH, no TLS.
# Use with REDIS_HOST=localhost, REDIS_PORT=6379 in backend/.env.
services:
  valkey:
    image: valkey/valkey:9
    ports:
      - "6379:6379"
    # BullMQ requires keys never be evicted.
    command: ["valkey-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # OpenDecision microservice (opendecision-microservice/). Not started by a plain `docker compose up`:
  #   docker compose --profile opendecision up --build
  # The model is off by default here: on CPU a value check takes ~2.6 s, so run it with
  # DECISION_BACKEND=opendecision only on a GPU host (and build with the CUDA torch index, see opendecision-microservice/Dockerfile).
  opendecision:
    profiles: ["opendecision"]
    build: ./opendecision-microservice
    ports:
      - "8100:8100"
    environment:
      DECISION_BACKEND: ${DECISION_BACKEND:-none}
      ANALYSIS_SERVICE_TOKEN: ${ANALYSIS_SERVICE_TOKEN:-}
    volumes:
      - opendecision-models:/models
    restart: unless-stopped

volumes:
  valkey-data:
  opendecision-models:
