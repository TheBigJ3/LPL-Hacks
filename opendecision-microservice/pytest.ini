[pytest]
testpaths = tests
pythonpath = .
markers =
    model: needs the OpenDecision model loaded (GPU recommended); skip with -m "not model"
xfail_strict = true
addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning:fastapi.testclient
    ignore:Using `httpx` with `starlette.testclient`
